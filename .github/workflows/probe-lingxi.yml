name: probe-lingxi

# 一次性只读探测：仅查询任务状态，绝不调用签到接口。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only status probe
        env:
          LINGXI_COOKIE: ${{ secrets.LINGXI_PROBE_COOKIE }}
        run: |
          set +x
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          cookie = os.environ.get("LINGXI_COOKIE", "")
          print("cookie_present:", bool(cookie), "| cookie_len:", len(cookie))
          req = urllib.request.Request(
              "https://lingxi.kdocs.cn/api/public/v1/tasks",
              headers={
                  "Cookie": cookie,
                  "Accept": "application/json, text/plain, */*",
                  "Referer": "https://lingxi.kdocs.cn/",
                  "Origin": "https://lingxi.kdocs.cn",
                  "User-Agent": (
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                      "(KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36"
                  ),
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=25) as resp:
                  raw, status = resp.read().decode("utf-8", "replace"), resp.status
          except urllib.error.HTTPError as exc:
              raw, status = exc.read().decode("utf-8", "replace"), exc.code
          except Exception as exc:  # noqa: BLE001
              raw, status = type(exc).__name__ + ": " + str(exc)[:120], 0

          print("http_status:", status)
          print("body_is_json:", raw.lstrip().startswith("{"))
          print("body_len:", len(raw))
          try:
              doc = json.loads(raw)
              tasks = doc["data"]["tasks"]
              task = next(x for x in tasks if x.get("task_key") == "daily_check_in")
              print("daily_check_in_status:", task.get("status"))
              print("top_level_result:", doc.get("result"))
              print("VERDICT: CLOUD_OK")
          except Exception as exc:  # noqa: BLE001
              print("parse_failed:", type(exc).__name__)
              print("VERDICT: CLOUD_REJECTED_OR_NETWORK")
          PY
